<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo" [fullscreen]="true">
  <div class="fondo-perfil">
    <ion-avatar>
      <img alt="Silhouette of a person's head" src="https://ionicframework.com/docs/img/demos/avatar.svg"/>
    </ion-avatar>
    <h1>Datos del Usuario</h1>
    <div class="datos-cliente">
      <ion-label class="datos">Nombre: nombre||apellido</ion-label>
      <ion-label class="datos">Email: email</ion-label>
      <ion-label class="datos">Telefono: telefono</ion-label>
    </div>
    <ion-button class="boton-actu" expand="block" fill="outline" color="primary">Actualizar Datos</ion-button>
  </div>
</ion-content>
